name: Daily Food Emulsion Digest

on:
  schedule:
    # 07:00 Asia/Seoul = 22:00 UTC (previous day)
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, do not send Telegram messages and print only"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      MAX_ITEMS: ${{ vars.MAX_ITEMS || '12' }}
      LOOKBACK_HOURS: ${{ vars.LOOKBACK_HOURS || '24' }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL || 'your_email@example.com' }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO || 'your_email@example.com' }}

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily digest
        run: |
          python src/digest.py --dry-run "${DRY_RUN}"
